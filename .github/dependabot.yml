version: 2
updates:
- package-ecosystem: nuget
  directory: /Solutions
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    microsoft-identity:
      patterns:
      - Microsoft.Identity.*
    microsoft-extensions:
      patterns:
      - Microsoft.Extensions.*

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  ignore:
  # Held at v1.9 until our other processes move to actions/create-github-app-token
  - dependency-name: tibdex/github-app-token
  groups:
    github-actions:
      patterns:
      - "*"
